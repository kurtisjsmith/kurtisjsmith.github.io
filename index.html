<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kurtisjsmith</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="terminal">

        <div class="titlebar">

            <div class="traffic-lights">
                <button class="red" id="terminal-reset" aria-label="Reset terminal"></button>
                <button class="yellow" id="terminal-minimize" aria-label="Minimize terminal"></button>
                <button class="green" id="terminal-expand" aria-label="Expand terminal"></button>
            </div>

            <div class="title">
                kurtisjsmith@portfolio
            </div>

        </div>

        <div class="terminal-body">

            <div id="output"></div>

        </div>

    </div>

    <div class="main-content" id="main-content">

        <div class="content-titlebar">

            <div class="content-traffic-lights">
                <button class="red" id="content-close" aria-label="Close content"></button>
                <button class="yellow" id="content-minimize" aria-label="Minimize content"></button>
                <button class="green" id="content-expand" aria-label="Expand content"></button>
            </div>

            <div class="content-title">
                kurtisjsmith@portfolio
            </div>

        </div>

        <div class="content-body" id="content-body">

            <!-- Portfolio content will be loaded here -->

        </div>

    </div>

    <script src="js/pages.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/commands.js"></script>
    <script src="js/typing.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
